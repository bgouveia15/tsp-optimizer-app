<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Round 152 (F8N-1) links probe. Not app UI; unlinked from the app.
       No storage, no external file; the only request to another origin is a
       tap on cases 8 and 9 (example.com, ruling 654). See tool/probes/README.md. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Links probe — round 152</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 16px; color: #1d2b36; }
    h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
    p.note { font-size: 13px; color: #6b7a86; margin: 0 0 14px; }
    .case { display: block; width: 100%; box-sizing: border-box; margin: 0 0 10px; padding: 12px;
            font-size: 15px; text-align: left; border: 1px solid #c3ccd5; border-radius: 10px;
            background: #fff; color: #1f5f8b; text-decoration: none; font-family: inherit; }
  </style>
</head>
<body>
  <h1>Links probe — round 152. Each button tries to open a page. Nothing is saved. Buttons 8 and 9 open example.com, a neutral reserved example site, when tapped.</h1>
  <p class="note">Tap each, note what happens (new tab / same tab / nothing), come back.</p>

  <a class="case" id="c1" href="target.html" target="_blank">1 — plain link, new tab</a>
  <a class="case" id="c2" href="target.html">2 — plain link, same tab</a>
  <button class="case" id="c3" type="button">3 — tap: window.open(url)</button>
  <button class="case" id="c4" type="button">4 — tap: window.open(url, '', 'noopener,noreferrer') (the app's call)</button>
  <button class="case" id="c5" type="button">5 — tap: open after a timer</button>
  <button class="case" id="c6" type="button">6 — pointerup: the app's call</button>
  <button class="case" id="c7a" type="button">7a — pointerdown: the app's call</button>
  <button class="case" id="c7b" type="button">7b — touchend: the app's call</button>
  <button class="case" id="c7c" type="button">7c — tap: the app's call after a microtask</button>
  <button class="case" id="c8" type="button">8 — tap: window.open(example.com)</button>
  <button class="case" id="c9" type="button">9 — tap: the app's call to example.com</button>

  <script>
    // The target is built from this page's own location; no host is typed.
    var url = new URL('target.html', location.href).href;
    var off = 'https://example.com/';
    function on(id, type, fn) { document.getElementById(id).addEventListener(type, fn); }
    // url_launcher_web 2.4.3 openNewWindow: window.open(url, target, 'noopener,noreferrer'),
    // target '' for an https link on Safari (url_launcher_web.dart:71-90).
    function appCall(u) { window.open(u, '', 'noopener,noreferrer'); }
    on('c3', 'click', function () { window.open(url); });
    on('c4', 'click', function () { appCall(url); });
    on('c5', 'click', function () { setTimeout(function () { window.open(url); }, 0); });
    on('c6', 'pointerup', function () { appCall(url); });
    on('c7a', 'pointerdown', function () { appCall(url); });
    on('c7b', 'touchend', function () { appCall(url); });
    on('c7c', 'click', function () { Promise.resolve().then(function () { appCall(url); }); });
    on('c8', 'click', function () { window.open(off); });
    on('c9', 'click', function () { appCall(off); });
  </script>
</body>
</html>
